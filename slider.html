<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>منيو أطياف المصور | Atyaf Ice Cream Mobile Gallery</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #080612;
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            direction: rtl;
        }

        /* FULLSCREEN SLIDER TRACK (LTR viewport for 100% cross-browser mobile accuracy) */
        .slider-viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            direction: ltr;
            touch-action: pan-y pinch-zoom;
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            direction: ltr;
        }

        .slide-item {
            min-width: 100vw;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            direction: rtl;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            cursor: zoom-in;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        /* TOP BACK BUTTON */
        .back-link-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            background: rgba(15, 12, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .back-link-btn:active,
        .back-link-btn:hover {
            background: #4E3CF6;
            border-color: #4E3CF6;
        }

        /* FLOATING SIDE ARROWS (Optimized for Mobile) */
        .arrow-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 90;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .arrow-btn:active,
        .arrow-btn:hover {
            background: #4E3CF6;
            border-color: #4E3CF6;
            transform: translateY(-50%) scale(1.08);
        }

        .arrow-btn.prev {
            right: 14px;
        }

        .arrow-btn.next {
            left: 14px;
        }

        .arrow-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* FLOATING PILL COUNTER & DOTS */
        .floating-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 90;
            background: rgba(15, 12, 32, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .dots-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: #FFC72C;
            width: 22px;
            border-radius: 10px;
        }

        .page-indicator {
            font-size: 0.88rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.95);
            white-space: nowrap;
        }

        /* LAST SLIDE SOCIAL PAGE (Mobile Tailored) */
        .social-slide-box {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background: radial-gradient(circle at center, #1E1745 0%, #080612 100%);
            overflow-y: auto;
        }

        .social-logo {
            height: 85px;
            width: auto;
            margin-bottom: 16px;
        }

        .social-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .social-sub {
            font-size: 0.92rem;
            color: #FFC72C;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .social-btns-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 520px;
            margin-bottom: 20px;
        }

        .social-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 16px;
            border-radius: 16px;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            transition: transform 0.2s ease;
        }

        .social-link-btn:active {
            transform: scale(0.97);
        }

        .btn-fb {
            background: linear-gradient(135deg, #1877F2 0%, #0A54BA 100%);
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .btn-phone-1 {
            background: linear-gradient(135deg, #4E3CF6 0%, #3728BF 100%);
        }

        .btn-phone-2 {
            background: linear-gradient(135deg, #FFC72C 0%, #D9A200 100%);
            color: #1A173B;
        }

        .branches-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            max-width: 520px;
            width: 100%;
            line-height: 1.5;
        }

        /* FULLSCREEN LIGHTBOX ZOOM */
        .zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.96);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .zoom-img {
            max-width: 98vw;
            max-height: 98vh;
            object-fit: contain;
        }

        .close-zoom {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 600px) {
            .social-btns-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .social-title {
                font-size: 1.35rem;
            }

            .social-sub {
                font-size: 0.85rem;
            }

            .arrow-btn {
                width: 40px;
                height: 40px;
            }

            .arrow-btn.prev {
                right: 10px;
            }

            .arrow-btn.next {
                left: 10px;
            }

            .floating-controls {
                bottom: 14px;
                padding: 6px 14px;
                gap: 10px;
            }
        }
    </style>
</head>

    <!-- CROSS-BROWSER MOBILE SLIDER SCRIPT -->
    <script>
        let currentIndex = 0;
        const totalSlides = 6;

        const track = document.getElementById('track');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('counter');
        const dotsWrap = document.getElementById('dotsWrap');
        const zoomOverlay = document.getElementById('zoomOverlay');
        const zoomImg = document.getElementById('zoomImg');

        // Create Navigation Dots
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = `dot ${i === 0 ? 'active' : ''}`;
            dot.addEventListener('click', () => goToSlide(i));
            dotsWrap.appendChild(dot);
        }

        const dots = document.querySelectorAll('.dot');

        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            currentIndex = index;

            // In LTR viewport track, slide leftwards using negative percentage offset
            track.style.transform = `translateX(-${currentIndex * 100}%)`;

            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentIndex);
            });

            counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalSlides - 1;
        }

        // Arrow Button Actions
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goToSlide(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                if (currentIndex > 0) goToSlide(currentIndex - 1);
            } else if (e.key === 'ArrowLeft') {
                if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
            } else if (e.key === 'Escape') {
                zoomOverlay.classList.remove('active');
            }
        });

        // Mobile Touch Swipe Logic (Butter Smooth Cross-Browser)
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        const viewport = document.getElementById('viewport');

        viewport.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isDragging = true;
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = startX - endX;
            const diffY = startY - endY;

            // Only trigger horizontal swipe if horizontal movement is greater than vertical movement
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 35) {
                if (diffX > 0 && currentIndex < totalSlides - 1) {
                    goToSlide(currentIndex + 1); // Swipe Left -> Next
                } else if (diffX < 0 && currentIndex > 0) {
                    goToSlide(currentIndex - 1); // Swipe Right -> Prev
                }
            }
        }, { passive: true });

        // Click or Tap Image for Fullscreen Zoom Lightbox
        document.querySelectorAll('.slide-img').forEach(img => {
            img.addEventListener('click', () => {
                zoomImg.src = img.src;
                zoomOverlay.classList.add('active');
            });
        });

        document.getElementById('closeZoom').addEventListener('click', () => {
            zoomOverlay.classList.remove('active');
        });

        zoomOverlay.addEventListener('click', (e) => {
            if (e.target === zoomOverlay) zoomOverlay.classList.remove('active');
        });

        // Initial setup
        goToSlide(0);
    </script>
