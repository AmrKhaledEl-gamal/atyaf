<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>منيو أطياف المصور | Atyaf Ice Cream Menu Gallery</title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #080612;
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            direction: rtl;
        }

        /* FULLSCREEN SLIDER TRACK */
        .slider-viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            direction: rtl;
            touch-action: pan-y pinch-zoom;
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            direction: rtl;
        }

        .slide-item {
            min-width: 100vw;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            direction: rtl;
        }

        .menu-image-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100vh;
            max-height: 100dvh;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            cursor: zoom-in;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            display: block;
        }

        /* HOTSPOT CLICKABLE OVERLAYS (EXACT MATCH TO ATYAF.VERCEL.APP) */
        .instagram-hotspot {
            position: absolute;
            left: 16%;
            top: 36%;
            width: 27%;
            height: 15%;
            z-index: 100;
            cursor: pointer;
            border-radius: 12px;
        }

        .facebook-hotspot {
            position: absolute;
            right: 17%;
            top: 36%;
            width: 27%;
            height: 15%;
            z-index: 100;
            cursor: pointer;
            border-radius: 12px;
        }

        /* TOP BACK BUTTON */
        .back-link-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 150;
            background: rgba(15, 12, 32, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .back-link-btn:active,
        .back-link-btn:hover {
            background: #4E3CF6;
            border-color: #4E3CF6;
        }

        /* FLOATING SIDE ARROWS */
        .arrow-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 150;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .arrow-btn:active,
        .arrow-btn:hover {
            background: #4E3CF6;
            border-color: #4E3CF6;
            transform: translateY(-50%) scale(1.08);
        }

        .arrow-btn.prev {
            right: 14px;
        }

        .arrow-btn.next {
            left: 14px;
        }

        .arrow-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* FLOATING PILL COUNTER & DOTS */
        .floating-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 150;
            background: rgba(15, 12, 32, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .dots-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: #FFC72C;
            width: 22px;
            border-radius: 10px;
        }

        .page-indicator {
            font-size: 0.88rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.95);
            white-space: nowrap;
        }

        /* FULLSCREEN LIGHTBOX ZOOM */
        .zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.96);
            z-index: 250;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .zoom-img {
            max-width: 98vw;
            max-height: 98vh;
            object-fit: contain;
        }

        .close-zoom {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .arrow-btn {
                width: 40px;
                height: 40px;
            }

            .arrow-btn.prev {
                right: 10px;
            }

            .arrow-btn.next {
                left: 10px;
            }

            .floating-controls {
                bottom: 14px;
                padding: 6px 14px;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Top Back to Text Menu Button -->
    <a href="index.html" class="back-link-btn" title="القائمة النصية">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span>القائمة النصية</span>
    </a>

    <!-- Floating Navigation Arrows -->
    <button type="button" class="arrow-btn prev" id="prevBtn" title="الصورة السابقة">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M9 18l6-6-6-6" />
        </svg>
    </button>
    <button type="button" class="arrow-btn next" id="nextBtn" title="الصورة التالية">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M15 18l-6-6 6-6" />
        </svg>
    </button>

    <!-- Slider Viewport -->
    <div class="slider-viewport" id="viewport">
        <div class="slider-track" id="track">

            <!-- Slide 1: Menu 1 -->
            <div class="slide-item">
                <img src="images/menu1.jpeg" alt="منيو 1" class="slide-img">
            </div>

            <!-- Slide 2: Menu 2 -->
            <div class="slide-item">
                <img src="images/menu2.jpeg" alt="منيو 2" class="slide-img">
            </div>

            <!-- Slide 3: Menu 3 -->
            <div class="slide-item">
                <img src="images/menu3.jpeg" alt="منيو 3" class="slide-img">
            </div>

            <!-- Slide 4: Menu 4 -->
            <div class="slide-item">
                <img src="images/menu4.jpeg" alt="منيو 4" class="slide-img">
            </div>

            <!-- Slide 5: Menu 5 (Exact last page with interactive Instagram & Facebook hotspot links from atyaf.vercel.app) -->
            <div class="slide-item">
                <div class="menu-image-container">
                    <img src="images/menu5.jpeg" alt="منيو 5 - للتواصل" class="slide-img">

                    <!-- Instagram Link Hotspot -->
                    <a href="https://www.instagram.com/atiaficecream.jo/" target="_blank" rel="noopener noreferrer"
                        class="instagram-hotspot" title="صفحتنا على إنستغرام (Instagram)"></a>

                    <!-- Facebook Link Hotspot -->
                    <a href="https://www.facebook.com/Atyafalmadinaicecream" target="_blank" rel="noopener noreferrer"
                        class="facebook-hotspot" title="صفحتنا على فيسبوك (Facebook)"></a>
                </div>
            </div>

        </div>
    </div>

    <!-- Floating Pill Counter & Dots -->
    <div class="floating-controls">
        <div class="dots-wrap" id="dotsWrap"></div>
        <div class="page-indicator" id="counter">1 / 5</div>
    </div>

    <!-- Fullscreen Lightbox Zoom Modal -->
    <div class="zoom-overlay" id="zoomOverlay">
        <button type="button" class="close-zoom" id="closeZoom">✕</button>
        <img src="" alt="تكبير" class="zoom-img" id="zoomImg">
    </div>

    <!-- SLIDER SCRIPT -->
    <script>
        let currentIndex = 0;
        const totalSlides = 5;

        const track = document.getElementById('track');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('counter');
        const dotsWrap = document.getElementById('dotsWrap');
        const zoomOverlay = document.getElementById('zoomOverlay');
        const zoomImg = document.getElementById('zoomImg');

        // Create Navigation Dots
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = `dot ${i === 0 ? 'active' : ''}`;
            dot.addEventListener('click', () => goToSlide(i));
            dotsWrap.appendChild(dot);
        }

        const dots = document.querySelectorAll('.dot');

        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            currentIndex = index;

            // In RTL viewport track, slide rightwards using positive percentage offset
            track.style.transform = `translateX(${currentIndex * 100}%)`;

            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentIndex);
            });

            counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === totalSlides - 1;
        }

        // Arrow Button Actions
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goToSlide(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                if (currentIndex > 0) goToSlide(currentIndex - 1);
            } else if (e.key === 'ArrowLeft') {
                if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
            } else if (e.key === 'Escape') {
                zoomOverlay.classList.remove('active');
            }
        });

        // Mobile Touch Swipe Logic
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        const viewport = document.getElementById('viewport');

        viewport.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isDragging = true;
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = startX - endX;
            const diffY = startY - endY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 35) {
                if (diffX > 0 && currentIndex < totalSlides - 1) {
                    goToSlide(currentIndex + 1);
                } else if (diffX < 0 && currentIndex > 0) {
                    goToSlide(currentIndex - 1);
                }
            }
        }, { passive: true });

        // Click Image for Lightbox Zoom
        document.querySelectorAll('.slide-img').forEach(img => {
            img.addEventListener('click', (e) => {
                // If user clicked on a hotspot link, don't open zoom
                if (e.target.classList.contains('instagram-hotspot') || e.target.classList.contains('facebook-hotspot')) return;
                zoomImg.src = img.src;
                zoomOverlay.classList.add('active');
            });
        });

        document.getElementById('closeZoom').addEventListener('click', () => {
            zoomOverlay.classList.remove('active');
        });

        zoomOverlay.addEventListener('click', (e) => {
            if (e.target === zoomOverlay) zoomOverlay.classList.remove('active');
        });

        // Initial setup
        goToSlide(0);
    </script>
</body>

</html>
